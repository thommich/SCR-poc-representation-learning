[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scr-repr-poc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2", "numpy>=1.26,<3", "pandas>=2.1,<3", "pyarrow>=15,<23", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
experiments = ["torch>=2.2,<3", "lightgbm>=4,<5", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<9"]
aws = ["boto3>=1.34,<2"]

[project.scripts]
scr-features = "scr_features.cli:main"

[tool.setuptools.packages.find]
include = ["scr_features*"]
